<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>إنشاء حساب / تسجيل الدخول</title>
</head>
<body>

  <header class="header">
    <a class="navbar-brand" href="index.html">
        <span>علمني</span>
        <img src="./src/assets/imgas/icon-profiel.png" alt="logo">
    </a>
  </header>

  <main class="auth-wrapper">

    <!-- إنشاء حساب -->
    <section class="auth-card" id="register-section">
      <h2>إنشاء حساب جديد</h2>

      <input type="text" placeholder="الاسم">
      <input type="text" placeholder="كود الطالب">
      <input type="email" placeholder="البريد الإلكتروني">
      <input type="password" placeholder="كلمة المرور">
      <input type="password" placeholder="تأكيد كلمة المرور">

      <button class="btn btn-card"> الدخول</button>
      <div class="auth-links">
        <a href="#" class="link">هل نسيت كلمة المرور؟</a>
        <a href="#" class="add-account" onclick="showLogin(event)">
         تسجيل الدخول
        </a>

      </div>
    </section>

    <section class="auth-card hidden" id="login-section">
        <h2>تسجيل الدخول</h2>

        <input type="email" placeholder="البريد الإلكتروني">
        <input type="password" placeholder="كلمة المرور">

        <button class="btn btn-card">تسجيل الدخول</button>

        <div class="auth-links">
            <a href="#" class="link">هل نسيت كلمة المرور؟</a>
            <a href="#" class="add-account" onclick="showRegister(event)">
             إنشاء حساب جديد
            </a>

        </div>
    </section>

  </main>
</body>
</html>
